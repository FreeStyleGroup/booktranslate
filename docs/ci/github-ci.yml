# Заготовка GitHub Actions. Лежит вне .github/workflows намеренно:
# токен, которым ведётся разработка, не имеет права workflow, и GitHub
# отклоняет любой push, создающий или меняющий файлы в .github/workflows.
# После «gh auth refresh -h github.com -s workflow» файл переезжает в
# .github/workflows/ci.yml и начинает работать.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон: очередь не забивается
# сборками кода, который уже никто не смотрит.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Какие части затронуты. Правка витрины не должна гонять тесты бэкенда:
  # на большом проекте это разница между двумя минутами и пятнадцатью.
  changes:
    name: Что затронуто
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            api:
              - 'apps/api/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'

  web:
    name: Витрина
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # npm ci, а не install: сборка обязана падать при рассинхроне
      # package.json и lock-файла, а не молча ставить другие версии.
      - run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Типы
        run: npm run typecheck

      - name: Сборка
        run: npm run build

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # Настоящий Postgres, а не SQLite: схема использует JSONB и перечисления
    # Postgres, и тест на другой базе проверял бы другой код.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booktranslate
          POSTGRES_PASSWORD: booktranslate
          POSTGRES_DB: booktranslate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booktranslate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://booktranslate:booktranslate@localhost:5432/booktranslate_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Линтер
        run: ruff check .

      - name: Форматирование
        run: ruff format --check .

      - name: Типы
        run: mypy app

      # Миграции прогоняются на чистой базе в обе стороны: так ловится
      # ревизия, которая накатывается, но не откатывается, — а узнать об
      # этом на боевой базе стоит дороже всего.
      - name: Миграции вверх
        run: alembic upgrade head

      - name: Миграции вниз
        run: alembic downgrade base

      - name: Миграции вверх повторно
        run: alembic upgrade head

      - name: Тесты
        run: pytest
