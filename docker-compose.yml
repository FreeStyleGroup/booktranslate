# Локальная среда разработки: база и API.
# Витрина (apps/web) поднимается отдельно через npm run dev — так быстрее
# горячая перезагрузка, а в контейнере от неё пользы нет.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booktranslate
      POSTGRES_PASSWORD: booktranslate
      POSTGRES_DB: booktranslate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # API стартует только после того, как база реально отвечает:
      # без проверки контейнер поднимается раньше готовности Postgres,
      # и первая же миграция падает на отказе в соединении.
      test: ["CMD-SHELL", "pg_isready -U booktranslate -d booktranslate"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://booktranslate:booktranslate@postgres:5432/booktranslate
      ENVIRONMENT: development
      DEBUG: "true"
      # Исходные файлы — на отдельном томе, а не рядом с кодом: иначе они
      # попадают в рабочую копию и в git-статус разработчика.
      STORAGE_ROOT: /var/booktranslate/storage
    ports:
      - "8000:8000"
    volumes:
      # Код подключён томом: правка файла подхватывается без пересборки
      # образа. Пересборка нужна только при изменении зависимостей.
      - ./apps/api:/app
      - api_storage:/var/booktranslate/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    # Фоновый перевод: книга ставится в очередь и переводится без человека.
    # Тот же образ и тот же код, что у API, — разная только команда.
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://booktranslate:booktranslate@postgres:5432/booktranslate
      ENVIRONMENT: development
      STORAGE_ROOT: /var/booktranslate/storage
      # На разработке очередь опрашивается чаще: ждать пять секунд, проверяя
      # только что поставленное задание, — это пять секунд на каждую проверку.
      WORKER_POLL_SECONDS: "2"
    volumes:
      - ./apps/api:/app
      - api_storage:/var/booktranslate/storage
    command: python -m app.worker
    stop_grace_period: 30s
    # Проверка живости из образа — запрос к порту API, которого у рабочего
    # нет: без этой строки контейнер навсегда «unhealthy».
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  api_storage:
