[alembic]
script_location = alembic
prepend_sys_path = .
# Имя ревизии начинается с даты: в списке файлов миграции идут в том же
# порядке, в каком применялись, без чтения revision/down_revision.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
# Строка подключения берётся из окружения в env.py — здесь её нет намеренно,
# чтобы пароль не попал в репозиторий.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
