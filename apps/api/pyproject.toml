[project]
name = "booktranslate-api"
version = "0.1.0"
description = "API платформы перевода технической документации"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "sqlalchemy==2.0.43",
    "alembic==1.16.4",
    "asyncpg==0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "httpx==0.28.1",
    "ruff==0.13.0",
    "mypy==1.18.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
# Alembic-миграции — сгенерированный код с чужими соглашениями;
# проверять их строгой типизацией смысла нет.
exclude = "alembic/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
