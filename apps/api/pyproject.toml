[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booktranslate-api"
version = "0.1.0"
description = "API платформы перевода технической документации"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    # extra «email» тянет email-validator: без него EmailStr падает при
    # построении схемы, то есть приложение не поднимется вовсе.
    "pydantic[email]==2.11.7",
    "pydantic-settings==2.10.1",
    "sqlalchemy==2.0.43",
    "alembic==1.16.4",
    "asyncpg==0.30.0",
    "pyjwt==2.13.0",
    # Argon2id — рекомендация OWASP для новых проектов: в отличие от bcrypt
    # он нагружает не только процессор, но и память, что обесценивает
    # перебор на видеокартах. Библиотека берётся напрямую, без passlib:
    # passlib не поддерживается с 2020 года и тянет legacy-алгоритмы.
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "httpx==0.28.1",
    "ruff==0.13.0",
    "mypy==1.18.1",
]

[tool.setuptools.packages.find]
# Пакет дистрибутива один — app. Без явного указания setuptools видит рядом
# каталог alembic, считает его вторым верхнеуровневым пакетом и отказывается
# собирать: «Multiple top-level packages discovered in a flat-layout».
# Миграции пакетом и не являются — это скрипты, которые запускает alembic.
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# Depends в значении по умолчанию — не ошибка, а способ объявления
# зависимостей во FastAPI: вызов исполняется фреймворком на каждый запрос,
# а не один раз при импорте, поэтому обычная опасность изменяемых значений
# по умолчанию здесь не возникает.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.isort]
# Каталог миграций называется так же, как библиотека, поэтому ruff по
# умолчанию считает «alembic» своим пакетом и требует переставить импорт
# в блок первопартийных. Свой здесь только app.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
# Alembic-миграции — сгенерированный код с чужими соглашениями;
# проверять их строгой типизацией смысла нет.
exclude = "alembic/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
